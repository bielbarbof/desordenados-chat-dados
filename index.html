<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#090a0c" />
  <title>DSO Chat</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <main id="app" class="app-shell">
    <section class="chat-column">
      <header class="app-header">
        <div class="brand-block">
          <strong>DSO CHAT</strong>
          <button id="identityButton" class="identity-button" title="Alterar nome do personagem">Conectando…</button>
        </div>
        <button id="testToggle" class="test-toggle" type="button" aria-label="Abrir painel de testes" aria-expanded="false">
          <span class="test-toggle-mark">+</span><span>TESTE</span>
        </button>
      </header>

      <section id="feed" class="feed" aria-live="polite"></section>

      <section class="composer-wrap">
        <div class="composer-bar">
          <span class="composer-status">MENSAGEM // <b>ENTER</b> ENVIA</span>
        </div>
        <textarea id="messageInput" placeholder="Mensagem…  /r 3d20+5" aria-label="Mensagem"></textarea>
        <div id="errorBanner" class="error-banner hidden"></div>
      </section>

      <section class="dice-tray" aria-label="Bandeja de dados">
        <div class="tray-label"><span>ARSENAL DE DADOS</span><span class="tray-rule"></span></div>
        <div id="diceRow" class="dice-row"></div>
        <div class="tray-controls">
          <div class="stepper" aria-label="Quantidade de dados">
            <button id="countMinus" type="button" aria-label="Diminuir quantidade">−</button>
            <strong id="diceCount">1</strong>
            <button id="countPlus" type="button" aria-label="Aumentar quantidade">+</button>
          </div>
          <label class="modifier-input">
            <span>BÔNUS</span>
            <input id="modifierInput" type="number" value="0" aria-label="Bônus da rolagem" />
          </label>
          <button id="keepButton" class="keep-button" disabled title="Alternar entre manter o maior e o menor">KH</button>
          <button id="rollButton" class="roll-button">ROLAR</button>
        </div>
      </section>
    </section>

    <aside id="testPanel" class="test-panel" aria-label="Painel de testes" aria-hidden="true">
      <div class="test-panel-header">
        <div>
          <strong>FICHA RÁPIDA</strong>
          <small>Configure uma vez. Clique no d20 para rolar.</small>
        </div>
        <button id="testClose" class="icon-button" type="button" aria-label="Fechar painel">×</button>
      </div>

      <section class="attribute-config" aria-label="Valores dos atributos">
        <div class="section-line"><span>ATRIBUTOS // DADOS</span><span></span></div>
        <div id="attributeGrid" class="attribute-grid"></div>
      </section>

      <section class="skill-matrix" aria-label="Perícias">
        <div class="skill-table-head" aria-hidden="true">
          <span>PERÍCIA</span>
          <span>DADOS</span>
          <span>BÔNUS</span>
          <span>TREINO</span>
          <span>OUTROS</span>
        </div>
        <div id="skillRows" class="skill-rows"></div>
      </section>

      <footer class="test-panel-footer">
        <span>OUTROS = bônus ou penalidade manual.</span>
        <span>0 / 5 / <b class="legend-10">10</b> / <b class="legend-15">15</b></span>
      </footer>
    </aside>

    <div id="loading" class="loading-overlay"><span class="loading-mark"></span>Conectando ao Owlbear…</div>
  </main>
  <script type="module" src="./app.js"></script>
</body>
</html>
